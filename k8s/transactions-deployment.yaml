apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: transactions             # Use the label 'app: transactions' to select the pods.
  template:
    metadata:
      labels:
        app: transactions           # Label the pods with 'app: transactions'.
    spec:
      containers:
        - name: transactions
          image: transactions:latest # Use the 'transactions:latest' image.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http            # Expose port 3000 and name it 'http'.
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017"  # Set MongoDB URI to connect to the database.
            - name: PORT
              value: "3000"                # Set the port that the app will listen on.
          readinessProbe:
            tcpSocket:
              port: 3000                  # Readiness probe uses TCP socket on port 3000.
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000                  # Liveness probe uses TCP socket on port 3000.
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"                # Request 100m CPU and 128Mi memory for each pod.
              memory: "128Mi"
            limits:
              cpu: "500m"                # Limit the pod to 500m CPU and 512Mi memory.
              memory: "512Mi"
